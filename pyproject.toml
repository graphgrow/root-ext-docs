[project]
name = "root-ext-docs"
version = "0.2.0"
description = "Document-engineering MCP tool server: PDF page rendering and OCR, DOCX/PPTX extraction, image transforms, and archive handling. Extract and derive, never mutate sources."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9",
    "pypdfium2>=4.30",
    "pillow>=10",
    "python-docx>=1.1",
    "python-pptx>=1.0",
]

[project.scripts]
root-ext-docs = "root_ext_docs.server:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# SKILL.md is model-facing instruction the client extracts from the wheel
# at install (ADR-0025), so every build target must name it or it is
# silently dropped. Declared globally, NOT on the wheel target alone:
# `uv build` produces the sdist first and then builds the wheel FROM it,
# so a wheel-only rule loses it on that path — the same version shipping
# with or without its instructions depending on how it was built.
[tool.hatch.build]
artifacts = ["src/root_ext_docs/SKILL.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/root_ext_docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
